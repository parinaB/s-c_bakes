<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - LocalStorage Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff3f3;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .admin-container {
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #ff6b6b;
      margin-bottom: 30px;
      text-align: center;
    }
    .section {
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 2px solid #eee;
    }
    .section:last-child {
      border-bottom: none;
    }
    .view-btn {
      background-color: #ff6b6b;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      margin: 10px;
    }
    .view-btn:hover {
      background-color: #ff4c4c;
    }
    .display-box {
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      border: 1px solid #ddd;
    }
    .button-group {
      text-align: center;
    }
    .file-path {
      background-color: #e7e2dc;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #4a2c2a;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>Admin Dashboard</h1>
    
    <div class="section">
      <h2>Orders & Bookings</h2>
      <p>View all cart checkouts, workshop bookings, and self-fun bookings</p>
      <div class="button-group">
        <button class="view-btn" onclick="viewOrders()">View Orders</button>
      </div>
      <div class="file-path">
        <strong>Data Source:</strong> localStorage "orders"
      </div>
      <div id="ordersDisplay" class="display-box" style="display: none;"></div>
    </div>

    <div class="section">
      <h2>Customer Feedback</h2>
      <p>View all feedback submissions</p>
      <div class="button-group">
        <button class="view-btn" onclick="viewFeedbacks()">View Feedbacks</button>
      </div>
      <div class="file-path">
        <strong>Data Source:</strong> localStorage "feedbacks"
      </div>
      <div id="feedbackDisplay" class="display-box" style="display: none;"></div>
    </div>
  </div>

  <script>
    // --- View Orders & Bookings ---
    function viewOrders() {
      const display = document.getElementById('ordersDisplay');
      let orders = JSON.parse(localStorage.getItem('orders')) || [];
      
      if (orders.length === 0) {
        display.textContent = "No orders/bookings submitted yet.";
      } else {
        let text = "";
        orders.forEach((o, i) => {
          text += `
===== Order ${i+1} =====
Type: ${o.type}
Name: ${o.name || '-'}
Date: ${o.date || '-'}
People: ${o.people || '-'}
Slot: ${o.slot || '-'}
Flavour: ${o.flavour || '-'}
Size: ${o.size || '-'}
Items: ${o.items ? o.items.map(it => it.name + " (Qty:" + it.quantity + ")").join("; ") : "-"}
Total: ₹${o.total || 0}
Submitted At: ${o.submittedAt || '-'}
=========================
`;
        });
        display.textContent = text;
      }
      display.style.display = "block";
    }

    // --- View Feedbacks ---
    function viewFeedbacks() {
      const display = document.getElementById('feedbackDisplay');
      let feedbacks = JSON.parse(localStorage.getItem('feedbacks')) || [];
      
      if (feedbacks.length === 0) {
        display.textContent = "No feedbacks submitted yet.";
      } else {
        let text = "";
        feedbacks.forEach((f, i) => {
          text += `
===== Feedback ${i+1} =====
Name: ${f.name}
Date: ${f.date}
Rating: ${f.rating}/5
Message: ${f.message || 'No additional comments'}
Submitted At: ${f.submittedAt || '-'}
=========================
`;
        });
        display.textContent = text;
      }
      display.style.display = "block";
    }
  </script>
</body>
</html>
